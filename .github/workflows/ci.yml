name: CI

# Rules every catena repo keeps. The check lives in catenahq/contracts and runs
# from there, so this repo holds no copy of it.

on:
  # Every pushed branch. Renovate and engine-bump branches always carry a pull
  # request, which tests each push to them.
  push:
    branches-ignore: ['renovate/**', 'engine-bump/**', 'scanctl/**']
  pull_request:

permissions:
  contents: read

jobs:
  repo-rules:
    name: Repo rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: renovate-config
          persist-credentials: false
      - name: Check out sibling contracts
        uses: catenahq/contracts/.github/actions/checkout-sibling@main
        with:
          repository: catenahq/contracts
          path: contracts
      - name: Repo rules (no tracked env file; .gitignore carries the env rule)
        working-directory: ./renovate-config
        run: node ../contracts/scripts/check-repo-rules.mjs

  validate-presets:
    name: Validate presets
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: 44.115.9
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Validate every preset with renovate-config-validator --strict
        run: npx --yes -p "renovate@${RENOVATE_VERSION}" renovate-config-validator --strict default.json
